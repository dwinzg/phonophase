[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phonophase"
dynamic = ["version"]
description = "Measuring where a group delay statistic separates genuine from synthetic speech across classes of sound, with cluster robust statistics and pre-registered tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Darwin Zhang" }]
keywords = [
    "speech-deepfake-detection", "anti-spoofing", "asvspoof",
    "modified-group-delay", "phase-features", "articulatory-features",
    "cross-lingual", "phonetics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is absent on purpose. The correct build is platform dependent, and on
# Colab or a CUDA cluster it is already present. Installing it from PyPI would
# replace a working CUDA build with one that may not match the driver.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "panphon>=0.20",
    # Imported directly by scripts/band_edge.py. librosa pulls it in as well.
    "soxr>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipython>=8.0", "ruff>=0.6"]
# Only the alignment pass needs these, so they are not a runtime dependency.
align = ["transformers>=4.40", "datasets>=2.18"]
# Only scripts/make_report_figures.py needs this.
report = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/dwinzg/phonophase"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "phonophase.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
# Long lines, one-line compound statements and lambdas are house style here;
# zip(strict=) adds noise where lengths match by construction; %-formatting is used in
# fixed-width tables where it reads better.
ignore = ["E501", "E702", "E731", "E741", "B905", "UP031"]
