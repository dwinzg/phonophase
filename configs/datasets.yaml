# ==========================================================================
# Dataset registry for PhonoPhase
# ==========================================================================
#
# Why this file exists
#   Nothing in this repository recorded which corpora were used, where they
#   came from, or under what terms. That made the published Bengali result
#   unverifiable by anyone, including its author. This is the fix.
#
# How to read the fields
#   licence_verified   true means the licence was read from the source page.
#                      false means it still needs checking before use or
#                      redistribution. Do not assume permissive.
#   licence_source     the specific URL, and where the URL alone would not
#                      show it, the exact location within that source (a
#                      README section, an API field, a bundled LICENSE
#                      file) that licence_verified is based on. A licence
#                      claim with no licence_source is exactly the defect
#                      this field exists to catch.
#   licence_checked    the date licence_source was actually read.
#   direct_url         present only where a stable direct link was confirmed.
#                      Opaque bitstream ids can change if a record is
#                      re-uploaded, so landing_page stays canonical.
#   status             in_use, candidate, or planned.
#
#   serves             which research phase this corpus is for. Order matters.
#                      H1 is the pre-registered test on ASVspoof 2019 eval and
#                      nothing else belongs in it. Everything else waits until
#                      H1 resolves, because adding corpora before then is how a
#                      project ends up with nine half answered questions.
#
# All URLs below were fetched and confirmed on 2026-09-18, except the licence
# fields (licence, licence_verified, licence_source, licence_checked, and any
# licence_note), which were independently re-audited against each corpus's
# own primary source on 2026-09-19. See licence_source on each entry for
# exactly what was read and where.
# ==========================================================================

asvspoof2019_la:
  name: "ASVspoof 2019 Logical Access"
  status: in_use
  serves: "H1, the pre-registered test. Do not add other corpora to this run."
  languages: [english]
  landing_page: "https://datashare.ed.ac.uk/handle/10283/3336"
  doi: "https://doi.org/10.7488/ds/2555"
  direct_url: "https://datashare.ed.ac.uk/bitstreams/a9f87c35-f055-4015-80e2-2fdff0d46269/download"
  filename: LA.zip
  size_gb: 7.12
  licence: "Open Data Commons Attribution License (ODC-BY) v1.0"
  licence_verified: true
  licence_source: >-
    https://datashare.ed.ac.uk/handle/10283/3336, and the bundled
    LICENSE_text.txt itself (served at
    https://datashare.ed.ac.uk/server/api/core/bitstreams/60c7de6d-37d3-45c1-b52e-9f18b0338e47/content),
    fetched directly. It is the ODC-BY 1.0 template verbatim.
  licence_checked: "2026-09-19"
  licence_note: >-
    ODC-BY grants extraction, re-utilisation, derivative databases and
    commercial use (Section 3.1), with no share-alike. It draws a
    distinction that matters directly here: a "Produced Work" (Section
    4.3) is a work resulting from using the Contents, as opposed to a
    republished copy of the Contents itself, and does not need the full
    licence-and-notices pass-through that Section 4.2 requires for
    Derivative Databases. A Produced Work only needs a notice "reasonably
    calculated to make any Person ... aware that Content was obtained from
    the Database", naming the database and linking to the ODC-BY text.
    results/eval_slices.csv.gz, a table of per-phoneme acoustic statistics
    computed from this corpus, is a Produced Work in that sense, and this
    licence does not block publishing it. It does require that notice to
    exist somewhere the table is published, and as of this audit it does
    not: there is no NOTICE or ATTRIBUTION file in this repository and no
    such notice in docs/RESOURCES.md. Suggested text: "Contains information
    from the ASVspoof 2019 database
    (https://datashare.ed.ac.uk/handle/10283/3336), available under the ODC
    Attribution License (https://opendatacommons.org/licenses/by/1-0/)."
  citation: "Todisco et al. 2019, arXiv:1904.05441"
  partitions:
    train: {utterances: 25380, bonafide: 2580, spoof: 22800, attacks: "A01-A06"}
    dev: {utterances: 24844, bonafide: 2548, spoof: 22296, attacks: "A01-A06"}
    eval: {utterances: 71237, bonafide: 7355, spoof: 63882, attacks: "A07-A19"}
  note: >-
    train and dev share attacks A01 to A06. Only eval holds unseen attacks, so
    only eval measures generalisation. Report on eval.

