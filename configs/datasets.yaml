asvspoof2021_df:
  name: "ASVspoof 2021 Speech Deepfake"
  status: planned
  serves: "replication of H1 on compressed audio"
  languages: [english]
  landing_page: "https://zenodo.org/records/4835108"
  licence: "ODC Open Database License (ODbL) v1.0"
  licence_verified: true
  licence_source: >-
    https://zenodo.org/api/records/4835108, structured record metadata,
    metadata.license.id == "odc-odbl". The rendered page at
    https://zenodo.org/records/4835108 states the same thing: "ODC Open
    Database License v1.0", linking to
    http://www.opendatacommons.org/licenses/odbl/1.0/. This is a different
    licence from the other three ASVspoof entries in this file, all of
    which are ODC-BY.
  licence_checked: "2026-09-19"
  licence_note: >-
    CORRECTED. This entry previously said "Open Data Commons Attribution
    License v1.0", apparently copied from its 2019 and 2021-LA neighbours
    without checking this record specifically. The Zenodo record for this
    dataset actually specifies ODbL, not ODC-BY. ODbL still permits
    extraction, commercial use, and Produced Works under a Section
    4.3-style notice requirement much like ODC-BY's (ODbL Sections
    4.6-4.8), so it would not have blocked a Produced Work such as a slice
    table either. The real difference is share-alike: under ODbL Section
    4.4, a Derivative Database that is publicly used must itself be
    released under ODbL, a later similar licence, or one ODbL's own terms
    treat as compatible. ODC-BY carries no such requirement. This corpus is
    "planned", not in use, so nothing downstream is affected by the
    correction yet, but the ODC-BY licence text should not be reused for
    this entry again.
  note: "Compressed and re-encoded audio, closer to real distribution conditions."

mlaad:
  name: "MLAAD, Multi-Language Audio Anti-Spoofing Dataset"
  status: candidate
  serves: "H2, the cross lingual test. 54 languages is the strongest available test of whether the effect is articulatory rather than English specific"
  priority: high
  languages_count: 54
  source_languages: [english, french, german, italian, polish, russian, spanish, ukrainian]
  # The 2024 paper reports 205 systems and 1153.6 hours. Those figures no longer
  # describe the live dataset, which was last modified 2026-08-28 and has grown
  # substantially. Verified 2026-09-18 against the HuggingFace tree API:
  #   fake/en 143 model directories
  #   fake/fr  42
  #   fake/pl  21
  #   18 models span all three, 1000 utterances each per language
  # Cite the paper for the method, not for the size of what you can download.
  hours_synthetic_paper: 1153.6
  tts_systems_paper: 205
  models_en_verified: 143
  models_spanning_en_fr_pl: 18
  utterances_per_model_per_language: 1000
  access: >-
    Gated, gated auto. Directory listings are public, everything under fake/ needs
    the account to be on the authorized list. Accept the terms while signed in
    before attempting to read meta.csv.
  landing_page: "https://huggingface.co/datasets/mueller91/MLAAD"
  mirror: "https://deepfake-total.com/mlaad"
  paper: "https://arxiv.org/abs/2401.09512"
  licence: "CC-BY-NC 4.0"
  licence_verified: true
  licence_source: >-
    https://huggingface.co/datasets/mueller91/MLAAD, dataset card, read
    2026-09-19. States: "MLAAD is published strictly for non-commercial
    academic research use, under the CC-BY-NC 4.0 license. Commercial use
    is not permitted." The raw README could not be fetched unauthenticated
    (the underlying files are gated), but the rendered card carries the
    licence statement in full and is visible before login.
  licence_checked: "2026-09-19"
  licence_note: >-
    Non commercial academic research only, with attribution. Stricter than
    this repository's MIT code licence, so it constrains anything trained
    on it: a slice table derived from MLAAD could not be redistributed for
    commercial use, only research use, and would need an attribution
    notice back to MLAAD. Access is also gated behind a click-through
    agreement on HuggingFace, a separate question from the licence itself.
  citation: "Müller et al. 2024, IJCNN, arXiv:2401.09512"
  requires: "M-AILABS for the bonafide side. MLAAD ships only the synthetic audio."
  real_side: "mailabs, see the entry below"
  note: >-
    The single most relevant candidate. The project's central claim is cross
    lingual generalisation, currently evidenced by one language. 54 languages
    turns that claim into something measurable.

indicsynth:
  name: "IndicSynth"
  status: candidate
  serves: "H2 for Indic languages including Bengali, and the data efficiency curve"
  priority: high
  languages: [bengali, gujarati, hindi, kannada, malayalam, marathi, odia,
              punjabi, sanskrit, tamil, telugu, urdu]
  hours_synthetic: 4000
  landing_page: "https://huggingface.co/datasets/vdivyasharma/IndicSynth"
  code: "https://github.com/vdivyas/IndicSynth"
  licence: "CC BY-NC 4.0"
  licence_verified: true
  licence_source: >-
    https://huggingface.co/datasets/vdivyasharma/IndicSynth, dataset card
    YAML metadata (license: cc-by-nc-4.0) and its own "## License" prose
    section: "IndicSynth is released under the CC BY-NC 4.0 License. It is
    intended for non-commercial, academic research only."
  licence_checked: "2026-09-19"
  licence_note: >-
    CORRECTED from "unknown". Non-commercial academic research only, the
    same restriction family as MLAAD above: a derived artifact could be
    shared for research but not commercial use, with attribution. The
    companion code repository (https://github.com/vdivyas/IndicSynth) ships
    a LICENSE file GitHub cannot classify as any standard licence, but the
    dataset itself, which is what this project would actually use, states
    its terms plainly and twice (tag and prose) on its own card, and that
    is what governs the data.
  note: >-
    Bengali is Indic, and this covers 12 low resource Indian languages
    including Bengali. It is the obvious source for the data efficiency curve,
    which needs far more Bengali than a single corpus provides, and it extends
    the same question to eleven neighbouring languages.

in_the_wild:
  name: "In-the-Wild"
  status: candidate
  serves: "robustness of H1 outside studio conditions"
  languages: [english]
  hours: 37.9
  composition: "19,963 bonafide and 11,816 spoof, 58 public figures"
  landing_page: "https://huggingface.co/datasets/mueller91/In-The-Wild"
  paper: "https://arxiv.org/abs/2203.16263"
  licence: "CC BY-SA 4.0"
  licence_verified: true
  licence_source: >-
    https://huggingface.co/datasets/mueller91/In-The-Wild, dataset card
    YAML metadata, license: cc-by-sa-4.0. There is no separate prose
    licence section, but the tag is on the dataset's own primary page and
    is the only licence signal it carries.
  licence_checked: "2026-09-19"
  licence_note: >-
    CORRECTED from "unknown". CC BY-SA 4.0 permits commercial use and
    derivative works with attribution, but is share-alike: material that
    counts as Adapted Material under the CC BY-SA terms, if publicly
    shared, must carry the same licence forward (or one Creative Commons
    treats as compatible). Unlike the ODC-BY entries above, Creative
    Commons has no separate "Produced Work" carve-out for aggregate
    outputs, so a slice table built substantially from this corpus would
    need that question settled before release under different terms. Not
    currently in_use, so this does not affect results/eval_slices.csv.gz,
    which is drawn from ASVspoof 2019 LA only.
  citation: "Müller et al. 2022, Interspeech"
  note: >-
    Real world audio rather than studio recordings, with background noise,
    codec artifacts and channel effects. Directly addresses the concern already
    that clean datasets flatter results.

bengali_candidates:
  name: "Bengali corpora, candidates for the one actually used"
  status: candidate
  serves: "H2 for Bengali, if an Indic language is added to the set"
  languages: [bengali]
  licence: "varies by candidate, see below. Not both candidates are verified."
  licence_verified: false
  licence_note: >-
    Left false at this level deliberately even though one candidate below
    is now fully verified: this key covers both candidates, only one of
    them has a stated licence, and fetch_data.py's guard should stay closed
    for this entry until a single candidate is actually chosen and used.
  candidates:
    - name: "Bengali Real and Deepfake Audio Dataset"
      landing_page: "https://ieee-dataport.org/documents/bengali-real-and-deepfake-audio-dataset-deepfake-detection"
      doi: "10.21227/eyg4-v467"
      licence: "CC BY 4.0"
      licence_verified: true
      licence_source: >-
        https://api.datacite.org/dois/10.21227/eyg4-v467, the DOI's own
        DataCite metadata, deposited by the publisher (IEEE DataPort):
        rightsList: [{rights: "Creative Commons Attribution 4.0
        International", rightsIdentifier: "cc-by-4.0", rightsIdentifierScheme:
        "SPDX"}]. The IEEE DataPort page itself renders its licence
        client-side behind a login wall, so this record was read instead:
        it is the publisher's own structured rights statement for this
        exact DOI, not a third party's summary of it.
      licence_checked: "2026-09-19"
      note: >-
        A purpose built Bengali deepfake corpus, 4000 authentic and 4000
        FreeVC-generated clips from 10 subjects. Attribution only:
        commercial use and redistribution of derivatives are permitted.
    - name: "BanglaFake"
      paper: "https://arxiv.org/abs/2505.10885"
      code: "https://github.com/KamruzzamanAsif/BanglaFake"
      landing_page: "https://huggingface.co/datasets/sifat1221/banglaFake"
      licence: "unverified: no licence stated anywhere its authors publish"
      licence_verified: false
      licence_source: >-
        Checked all three surfaces its authors control. GitHub
        (https://github.com/KamruzzamanAsif/BanglaFake): no LICENSE file,
        full README read, and GitHub's own API reports license: null.
        HuggingFace (https://huggingface.co/datasets/sifat1221/banglaFake):
        API tags are ["region:us"] only, no license tag, no LICENSE prose.
        arXiv (https://arxiv.org/abs/2505.10885): abstract and metadata
        state no licence for the dataset; the only licence marking on that
        page is arXiv's own default distribution rights for the manuscript,
        chosen by the authors at submission, which is not a statement about
        the dataset.
      licence_checked: "2026-09-19"
      note: >-
        Purpose built Bengali deepfake audio dataset. No licence has been
        granted by its authors on any surface checked, so under default
        copyright no reuse or redistribution is currently authorised. Do
        not adopt this candidate without an explicit licence grant from the
        authors.
  note: >-
    The corpus behind the 93.6 percent Bengali result is recorded nowhere. Until
    it is identified the number is unverifiable. Check these against whatever
    comes back from the cluster.

speechfake:
  name: "SpeechFake"
  status: planned
  serves: "H2 at scale, 46 languages"
  languages_count: 46
  paper: "https://arxiv.org/abs/2507.21463"
  code: "https://github.com/YMLLG/SpeechFake"
  licence: "CC BY 4.0"
  licence_verified: true
  licence_source: >-
    https://github.com/YMLLG/SpeechFake/blob/main/LICENSE: "This work,
    SpeechFake, is licensed under the Creative Commons Attribution 4.0
    International License (CC BY 4.0). Copyright (c) 2025 Ant Group."
    Matches the licence badge in the repository README.
  licence_checked: "2026-09-19"
  licence_note: >-
    CORRECTED from "unknown". Attribution only: commercial use and
    derivative works are permitted. One real caveat straight from the same
    LICENSE file: four of the generation tools used to produce part of the
    synthetic subset carry copyleft licences of their own (ChatTTS, EdgeTTS
    and Seed-VC are GPL-3.0, FireRedTTS is MPL-2.0), and the LICENSE file
    itself warns these "may require the resulting outputs or workflows to
    comply with the original terms" for whatever was generated with them.
    A derived artifact built from SpeechFake should either exclude samples
    generated by those four tools or check GPL-3.0/MPL-2.0 compatibility
    before redistribution; the rest of the corpus, including its real-side
    sources (VCTK, LibriTTS, AISHELL-1/3, CommonVoice, all separately
    permissively licensed per the same README), is plain CC BY 4.0.
  citation: "ACL 2025"
  note: "Large scale multilingual, 46 languages, recent generation methods."

xmad_bench:
  name: "XMAD-Bench, Cross-Domain Multilingual Audio Deepfake Benchmark"
  status: planned
  serves: "an established evaluation protocol, so H2 is comparable to other work"
  paper: "https://arxiv.org/abs/2506.00462"
  code: "https://github.com/ristea/xmad-bench"
  licence: "disputed, see licence_note. Do not use until resolved."
  licence_verified: false
  licence_source: >-
    Three sources, three different answers. (1) The repository's own
    LICENSE file
    (https://github.com/ristea/xmad-bench/blob/main/LICENSE) is stock
    Apache License 2.0, and GitHub's own licence detector agrees. (2) The
    repository's README, in its own "## License" section
    (https://github.com/ristea/xmad-bench/blob/main/README.md), states:
    "The source code and models are released under the Creative Common
    Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA
    4.0) license," and its Reference section calls this "this dataset or
    code." (3) The arXiv page's own article-rights badge
    (https://arxiv.org/abs/2506.00462, div class="abs-license") is CC BY-SA
    4.0: a third value again, and in any case that badge is arXiv's licence
    for the manuscript rather than a statement about the benchmark data.
  licence_checked: "2026-09-19"
  licence_note: >-
    Unresolved, reported rather than resolved. (1) and (2) contradict each
    other inside the same repository: a permissive OSI licence file against
    a non-commercial, share-alike README statement that explicitly claims
    to cover the dataset. This is not the same shape as the LRLspoof
    situation below, where the apparent conflict dissolved on inspection
    because the paper's body text made no licensing claim at all. Here the
    repository's own README makes an explicit, on-topic claim that flatly
    contradicts its own LICENSE file, and nothing checked resolves which
    one the authors actually intend. Picking Apache-2.0 because it is more
    convenient would be exactly the error this audit exists to avoid, so
    this is left unverified: treat it as CC BY-NC-SA 4.0, the stricter of
    the two, until the authors clarify, and do not publish anything derived
    from it before then. Still "planned" status, so nothing downstream
    currently depends on this.
  note: >-
    A benchmark rather than a corpus. Useful as an evaluation protocol for the
    cross lingual claim, so results are comparable to other work rather than
    self reported.

mailabs:
  name: "M-AILABS Speech Dataset"
  status: in_use
  serves: "the genuine speech side for H2. MLAAD ships synthetic audio only."
  languages: [german, english_us, english_uk, spanish, italian, ukrainian, russian, french, polish]
  landing_page: "https://github.com/imdatceleste/m-ailabs-dataset"
  # The original host caito.de is DNS dead, as are m-ailabs.bayern and
  # data.solak.de. Verified 2026-09-18, this route returns http 200 with correct
  # sizes. The most discoverable HuggingFace French mirror is a dead pointer.
  direct_url_pattern: "https://ics.tau-ceti.space/data/Training/stt_tts/{lang}.tgz"
  sizes_gib: {en_US: 7.47, en_UK: 3.47, fr_FR: 14.78, pl_PL: 4.24}
  hours: {en_US: 102, en_UK: 46, fr_FR: 190, pl_PL: 54}
  format: "mono wav, 16 kHz, no resampling needed"
  licence: "modified BSD three clause, permits research use and redistribution"
  licence_verified: true
  licence_source: >-
    https://github.com/imdatceleste/m-ailabs-dataset, README "## License"
    section, read 2026-09-19: "Redistribution and use in any form,
    including any commercial use, with or without modification are
    permitted", conditioned on retaining the copyright notice and not using
    contributors' names to endorse derived products without permission.
    The repository is maintained by I. Celeste Aurora (GitHub
    "imdatceleste", formerly "imdatsolak"), the dataset's original
    co-creator per its own citation ("Solak, I. Celeste Aurora and Naumov,
    Dima, 2017"), not a third party relicensing someone else's work. The
    README states this licence supersedes any restriction found in
    previously downloaded copies of the data, and the direct_url_pattern
    mirror above (ics.tau-ceti.space) is run by the same person.
  licence_checked: "2026-09-19"
  # The reason the language set gained Spanish. M-AILABS publishes no speaker
  # counts, these were reconstructed from papers that used the corpus.
  speakers:
    polish: 2
    english_us: 3
    russian: 3
    spanish: 21
    german: "5 plus others"
    french: "UNKNOWN, could not be determined, must be listed from the archive"
  note: >-
    Small speaker pools are a real confound. With two Polish voices a real
    versus synthetic separation may be separating those voices rather than
    genuine from synthetic speech. Spanish was added to the language set so
    speaker diversity varies deliberately from 2 to 21 and can be measured
    rather than assumed away.

lrl_spoof:
  name: "LRLspoof, Low-Resource Language Spoofing Corpus"
  status: candidate
  serves: >-
    H2, as an alternative or a complement to MLAAD. 66 languages against MLAAD's
    54, ungated, and MIT licensed rather than non commercial.
  priority: medium
  languages_count: 66
  utterances_synthetic: 1304455
  # Verified 2026-09-19 against the HuggingFace dataset card.
  bonafide_included: false
  access: "public, not gated, tarball download"
  landing_page: "https://huggingface.co/datasets/lab260/LRLspoof"
  paper: "https://arxiv.org/abs/2603.02364"
  licence: >-
    MIT (the dataset). The arXiv manuscript is separately CC BY-SA 4.0;
    that governs the paper text, not the corpus.
  licence_verified: true
  licence_source: >-
    Dataset: https://huggingface.co/datasets/lab260/LRLspoof, three
    independent signals agreeing: the card's YAML frontmatter (license:
    mit), the HuggingFace API's own repo tags (license:mit), and an inline
    "License: MIT" badge in the card body linking to
    opensource.org/licenses/MIT. Manuscript:
    https://arxiv.org/abs/2603.02364, raw page HTML contains
    `<div class="abs-license"><a href="http://creativecommons.org/licenses/by-sa/4.0/"
    title="Rights to this article" ...>`, which is arXiv's own
    author-selected licence for the submission. The full paper body text
    (all versions through v4, 471 KB of rendered HTML) was checked directly
    for any in-text licensing statement: there is none. No occurrence of
    "licence", "license", "MIT" or "CC BY" anywhere in the prose.
  licence_checked: "2026-09-19"
  licence_note: >-
    RESOLVED, and the resolution is not the conflict this entry used to
    describe. "MIT on the card, CC-BY-SA in the paper" conflated two
    different things: the dataset's own stated licence (MIT, stated on its
    primary hosting page in three independent places) and arXiv's
    per-submission "Rights to this article" metadata (CC BY-SA 4.0), which
    is arXiv's licence for hosting and redistributing the manuscript
    PDF/HTML, chosen by the authors at submission time, and is not a
    statement about the corpus. The paper's actual body text makes no
    data-licensing claim at all, checked directly rather than assumed. Per
    the brief that sent this audit: this is genuinely a per-component
    situation, just not the "code vs data" split that pattern usually
    takes. Component 1, the dataset (audio and labels, what this project
    would actually use): MIT, fully permissive, redistribution and
    commercial use allowed, only the copyright notice needs keeping.
    Component 2, the paper as a document: CC BY-SA 4.0, which would matter
    only if this project were redistributing the paper's own text or
    figures, which it is not. MIT is reported here because it is what the
    dataset's own page states on three independent surfaces, not because it
    is the more convenient answer: the CC-BY-SA statement this entry
    previously attributed to "the paper text" does not exist anywhere in
    the paper's text.
  system_metadata: >-
    The synthesis system is identifiable per sample from the path,
    language/tts_model/file.wav, and data/labels.parquet carries utterance_id
    and label.
  blocking_issue: >-
    Spoof only, exactly like MLAAD, so it does not solve the problem that
    actually constrains H2. The real side is the constraint. M-AILABS supplies
    it for four languages with 2 to 5 speakers each, and MLAAD's original_file
    gives utterance level pairing to the specific recording each sample was
    derived from. Unless LRLspoof records an equivalent pairing, adopting it
    would trade a paired design for a larger language count, which is the wrong
    trade for a study whose speaker confound is already its weakest point.
  before_using: >-
    Check whether it records which real recording each sample came from, and
    from what corpus. If it does not, any real side has to come from a
    different corpus, and recording channel would then be confounded with
    bonafide against spoof, which is a worse confound than the one being fixed.
